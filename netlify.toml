[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Die Checkliste liegt nicht in public/, sie wird nur über /api/checkliste mit persönlichem Link ausgeliefert
[functions.checkliste]
  included_files = ["druckversion/Startklar-Check.pdf"]
